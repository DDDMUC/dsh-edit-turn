# dsh-edit-turn bundle patch: inserts the plugin row into the profile roster.
#
# The node half serves the loopback-only /api/dsh-edit-turn/* routes and owns
# the rollback-and-re-prompt service; the browser half (exports "./client")
# mounts the per-message edit action, the in-place editor and the hidden-row
# ledger.
#
# The entry name is the BARE package name on purpose: the client-module scanner
# treats it as a package specifier and resolves `<name>/package.json`, so a
# subpath entry would be cached as "not a client package" and the browser half
# would silently never load.
- insert:
    - id: dsh-edit-turn
      name: 'dsh-edit-turn'
